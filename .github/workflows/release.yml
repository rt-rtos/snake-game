name: Release

on:
  push:
    tags: ['v*']
  # Manual runs from the Actions tab, useful for testing without cutting a tag.
  workflow_dispatch:

permissions:
  contents: write        # publish the release
  id-token: write        # sign attestations via GitHub's OIDC token
  attestations: write    # write attestations to the repo's attestation store

jobs:

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses-dev ninja-build

      - name: Configure
        run: cmake --preset linux

      - name: Build
        run: cmake --build --preset linux

      - name: Stage artifact
        run: |
          mv build/snake snake-linux-x86_64
          chmod +x snake-linux-x86_64
          file snake-linux-x86_64

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: snake-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: snake-linux-x86_64
          path: snake-linux-x86_64

  windows:
    name: Windows (x86_64, MinGW cross)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 ninja-build cmake

      - name: Configure
        run: cmake --preset windows-mingw

      - name: Build
        run: cmake --build --preset windows-mingw

      - name: Stage artifact
        run: |
          mv build-windows/snake.exe snake-windows-x86_64.exe
          file snake-windows-x86_64.exe

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: snake-windows-x86_64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: snake-windows-x86_64
          path: snake-windows-x86_64.exe

  macos-x86_64:
    name: macOS (Intel slice)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: brew install ninja ncurses

      - name: Configure
        run: cmake --preset mac

      - name: Build
        run: cmake --build --preset mac

      - name: Stage artifact
        run: |
          mv build/snake snake-macos-x86_64
          chmod +x snake-macos-x86_64
          file snake-macos-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: snake-macos-x86_64
          path: snake-macos-x86_64

  macos-arm64:
    name: macOS (Apple Silicon slice)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: brew install ninja ncurses

      - name: Configure
        run: cmake --preset mac

      - name: Build
        run: cmake --build --preset mac

      - name: Stage artifact
        run: |
          mv build/snake snake-macos-arm64
          chmod +x snake-macos-arm64
          file snake-macos-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: snake-macos-arm64
          path: snake-macos-arm64

  macos-universal:
    name: macOS (universal, lipo merge)
    runs-on: macos-latest
    needs: [macos-x86_64, macos-arm64]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: snake-macos-x86_64
          path: intel

      - uses: actions/download-artifact@v4
        with:
          name: snake-macos-arm64
          path: arm

      - name: Fuse with lipo
        run: |
          chmod +x intel/snake-macos-x86_64 arm/snake-macos-arm64
          lipo -create \
            -output snake-macos-universal \
            intel/snake-macos-x86_64 \
            arm/snake-macos-arm64
          lipo -info snake-macos-universal
          file snake-macos-universal

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: snake-macos-universal

      - uses: actions/upload-artifact@v4
        with:
          name: snake-macos-universal
          path: snake-macos-universal

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [linux, windows, macos-universal]
    # Only publish for real tag pushes, not workflow_dispatch dry runs.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: snake-*
          merge-multiple: true

      - name: List downloaded files
        run: ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            snake-linux-x86_64
            snake-windows-x86_64.exe
            snake-macos-universal
          generate_release_notes: true
          body: |
            Terminal Snake - prebuilt binaries.

            ### Verifying provenance
            Every binary below was built by [this workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) and carries a GitHub-signed build-provenance attestation. Verify with the [GitHub CLI](https://cli.github.com/):
            ```
            gh attestation verify <downloaded-file> --repo ${{ github.repository }}
            ```
            This cryptographically ties the file to the exact workflow run and commit that produced it - stronger than a self-hosted SHA256 sum.

            ### Linux (x86_64)
            ```
            chmod +x snake-linux-x86_64
            ./snake-linux-x86_64
            ```
            Needs `libncursesw6` (preinstalled on essentially every modern desktop distro) and glibc ≥ 2.35 (Ubuntu 22.04 / Debian 12 / Fedora 36 or newer).

            ### Windows (x86_64)
            Double-click `snake-windows-x86_64.exe`, or run it from `cmd`/PowerShell. PDCurses is statically linked; no runtime dependencies. SmartScreen may show an "unrecognized publisher" warning on first run - click **More info → Run anyway**.

            ### macOS (universal - Intel and Apple Silicon)
            The binary is unsigned, so Gatekeeper quarantines it on first download. Clear the flag once:
            ```
            chmod +x snake-macos-universal
            xattr -d com.apple.quarantine snake-macos-universal
            ./snake-macos-universal
            ```
